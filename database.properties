# ===================================================================
# VBAY SERVER DATABASE CONFIGURATION
# CẤU HÌNH CƠ SỞ DỮ LIỆU CHO MÁY CHỦ VBAY
# ===================================================================

# Loại cơ sở dữ liệu (db.type). Hỗ trợ: 'mysql' hoặc 'h2'
# - 'mysql': Yêu cầu máy chủ MySQL đang chạy (phù hợp cho chấm bài/production)
# - 'h2': Sử dụng CSDL nhúng cục bộ dưới dạng file (Zero-Setup, tự động chạy không cần cài đặt gì)
db.type=mysql

# Tự động xóa database cũ và tạo lại từ đầu khi khởi chạy Server?
# - false (Mặc định): Giữ nguyên dữ liệu cũ, chạy tiếp.
# - true: Xóa sạch database 'vbay' cũ và khởi tạo lại dữ liệu trắng tinh (Rất tiện cho việc chấm bài).
db.recreate=false

# -------------------------------------------------------------------
# Cấu hình cho MySQL (Khi chọn db.type=mysql)
# -------------------------------------------------------------------
mysql.host=localhost
mysql.port=1638
mysql.database=vbay
mysql.username=root
mysql.password=1234

# -------------------------------------------------------------------
# Cấu hình cho H2 Embedded Database (Khi chọn db.type=h2 hoặc tự động fallback)
# -------------------------------------------------------------------
# File CSDL vbay.mv.db sẽ tự động sinh ra ngay tại thư mục chạy Server
h2.url=jdbc:h2:./vbay.db;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;TRACE_LEVEL_SYSTEM_OUT=0;TRACE_LEVEL_FILE=0
h2.username=sa
h2.password=
