name: Manual Build & Package vBay

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công trực tiếp từ giao diện GitHub
    inputs:
      build_type:
        description: 'Chọn thành phần muốn build và đóng gói'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - server
          - client
  push: # Kích hoạt tự động khi push lên nhánh Dhung_Branch để workflow được ghi nhận và hiển thị trên giao diện Actions
    branches:
      - Dhung_Branch

jobs:
  build-and-package:
    name: Build & Package Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]


    steps:
    # 1. Checkout mã nguồn
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Thiết lập môi trường Java JDK 25 (Khớp với cấu hình pom.xml của dự án)
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Biên dịch và đóng gói ứng dụng bằng Maven
    - name: Build and Package with Maven
      shell: bash
      run: |
        if [ "${{ github.event.inputs.build_type }}" = "all" ] || [ "${{ github.event_name }}" = "push" ]; then
          echo "Building and packaging the entire project..."
          mvn clean package -DskipTests
        elif [ "${{ github.event.inputs.build_type }}" = "server" ]; then
          echo "Building and packaging only the Server module..."
          mvn clean package -pl server -am -DskipTests
        elif [ "${{ github.event.inputs.build_type }}" = "client" ]; then
          echo "Building and packaging only the Client module..."
          mvn clean package -pl client -am -DskipTests
        fi

        # Tạo thư mục release phẳng cực kỳ chuyên nghiệp
        echo "Creating a flat release directory..."
        mkdir -p release
        mkdir -p release/music
        mkdir -p release/uploads/products/thumbnails
        mkdir -p release/log

        # Copy các file JAR và đổi tên cho ngắn gọn, dễ chạy
        if [ -f client/target/client.jar ]; then
          cp client/target/client.jar release/client.jar
        fi
        if [ -f server/target/server.jar ]; then
          cp server/target/server.jar release/server.jar
        fi

        # Copy nhạc nền vào release/music
        if [ -d "music" ]; then
          cp -r music/* release/music/
        fi

        # Tạo file giữ chỗ trong log và uploads để không bị bỏ qua khi nén zip
        echo "placeholder" > release/log/.gitkeep
        echo "placeholder" > release/uploads/products/.gitkeep
        echo "placeholder" > release/uploads/products/thumbnails/.gitkeep

    # 4. Lưu trữ các file JAR thực thi gộp dependencies làm Artifacts
    - name: Upload Packaged JARs
      uses: actions/upload-artifact@v4
      with:
        name: vbay-executable-jars-${{ matrix.os }}-${{ github.event.inputs.build_type || 'all' }}
        path: release/
        if-no-files-found: warn
