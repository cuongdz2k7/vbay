name: Auto Attach Jars to Release

on:
  release:
    types: [published] # Tự động kích hoạt khi bạn nhấn nút "Publish release" trên GitHub

permissions:
  contents: write # Cấp quyền ghi để Action có thể upload file vào Release

jobs:
  build-and-upload-assets:
    name: Build & Upload Binaries to Release
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout mã nguồn
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Thiết lập môi trường Java JDK 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Biên dịch và đóng gói ứng dụng
    - name: Build and Package with Maven
      run: mvn clean package -DskipTests

    # 4. Tự động đính kèm các file JAR vào trang Release
    - name: Upload Executable JARs to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          server/target/*-jar-with-dependencies.jar
          client/target/*-jar-with-dependencies.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
