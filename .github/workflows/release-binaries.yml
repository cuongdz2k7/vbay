name: Auto Attach Jars to Release

on:
  release:
    types: [published] # Tự động kích hoạt khi bạn nhấn nút "Publish release" trên GitHub

permissions:
  contents: write # Cấp quyền ghi để Action có thể upload file vào Release

jobs:
  build-and-upload-assets:
    name: Build & Upload Binaries to Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]


    steps:
    # 1. Checkout mã nguồn
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Thiết lập môi trường Java JDK 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Biên dịch và đóng gói ứng dụng
    - name: Build and Package with Maven
      run: mvn clean package -DskipTests

    # 3.5 Đổi tên các file JAR theo hệ điều hành để tránh bị trùng đè khi upload
    - name: Rename JARs for Platform
      shell: bash
      run: |
        mv server/target/server-1.0-SNAPSHOT-jar-with-dependencies.jar server/target/server-1.0-SNAPSHOT-${{ matrix.os }}.jar
        mv client/target/client-1.0-SNAPSHOT-jar-with-dependencies.jar client/target/client-1.0-SNAPSHOT-${{ matrix.os }}.jar

    # 4. Tự động đính kèm các file JAR đã đổi tên vào trang Release
    - name: Upload Executable JARs to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          server/target/server-1.0-SNAPSHOT-${{ matrix.os }}.jar
          client/target/client-1.0-SNAPSHOT-${{ matrix.os }}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

